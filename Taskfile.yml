version: "3"

vars:
  LINTER_VER: "v2.13.2"

  GOMODCACHE:
    sh: go env GOMODCACHE

  GOCACHE:
    sh: go env GOCACHE

  GOSUMCACHE:
    sh: echo "$(go env GOPATH)/pkg/sumdb"

  # Root module + all standalone example modules.
  MODULE_DIRS:
    sh: |
      {
        printf '.\n'
        find ./examples -name go.mod -type f -print |
          while IFS= read -r mod; do
            dirname "$mod"
          done
      } | sort -u

env:
  # Resolve example imports against the current root checkout.
  GOWORK: "{{.ROOT_DIR}}/go.work"

tasks:
  init-workspace:
    desc: "Initialize or reset the local Go workspace"
    cmds:
      - bash .github/scripts/create-go-workspace.sh

  run:
    desc: "Run all project checks"
    deps:
      - init-workspace
    cmds:
      - task: verify
      - task: lint
      - task: test-race

  before-commit:
    desc: "Run all pre-commit checks"
    cmds:
      - task: run

  tidy:
    desc: "Tidy all modules"
    cmds:
      - for: { var: MODULE_DIRS }
        task: _tidy-module
        vars:
          WORK_DIR: "{{.ITEM}}"

  verify:
    desc: "Verify module files and compile all modules"
    deps:
      - init-workspace
    cmds:
      - for: { var: MODULE_DIRS }
        task: _verify-module
        vars:
          WORK_DIR: "{{.ITEM}}"

  lint:
    desc: "Lint all modules"
    deps:
      - init-workspace
    cmds:
      - for: { var: MODULE_DIRS }
        task: _run-linter
        vars:
          WORK_DIR: "/app/{{.ITEM}}"

  test:
    desc: "Run tests for all modules"
    deps:
      - init-workspace
    cmds:
      - for: { var: MODULE_DIRS }
        task: _run-tests
        vars:
          WORK_DIR: "{{.ITEM}}"

  test-race:
    desc: "Run tests with the race detector for all modules"
    deps:
      - init-workspace
    cmds:
      - for: { var: MODULE_DIRS }
        task: _run-race-tests
        vars:
          WORK_DIR: "{{.ITEM}}"

  coverage:
    desc: "Run root tests and print total coverage"
    deps:
      - init-workspace
    cmds:
      - |
        go test \
          -mod=readonly \
          -shuffle=on \
          -count=1 \
          -covermode=atomic \
          -coverpkg=./... \
          -coverprofile=coverage.out \
          ./...
      - go tool cover -func=coverage.out | grep total

  coverage:html:
    desc: "Generate HTML coverage report"
    deps:
      - coverage
    cmds:
      - go tool cover -html=coverage.out -o coverage.html

  bench-cache-all:
    desc: "Run all cache value decoding benchmarks"
    cmds:
      - task: bench-cache
      - task: bench-cache-parallel

  bench-cache:
    desc: "Benchmark cache value decoding"
    env:
      GOMAXPROCS: "1"
    cmds:
      - |
        GOWORK=off go test \
          -mod=readonly \
          -run='^$' \
          -bench='^BenchmarkDecodeCacheValue$' \
          -benchmem \
          -benchtime=1s \
          -count=5 \
          > bench.txt

  bench-cache-parallel:
    desc: "Benchmark parallel cache value decoding"
    cmds:
      - |
        GOWORK=off go test \
          -mod=readonly \
          -run='^$' \
          -bench='^BenchmarkDecodeCacheValueParallel$' \
          -benchmem \
          -benchtime=1s \
          -count=5 \
          -cpu=1,4,8,20 \
          > parallel.txt

  _tidy-module:
    internal: true
    requires:
      vars:
        - WORK_DIR
    dir: "{{.ROOT_DIR}}/{{.WORK_DIR}}"
    cmds:
      - echo "==> {{.WORK_DIR}}"
      - GOWORK=off go mod tidy -v

  _verify-module:
    internal: true
    requires:
      vars:
        - WORK_DIR
    dir: "{{.ROOT_DIR}}/{{.WORK_DIR}}"
    cmds:
      - echo "==> {{.WORK_DIR}}"
      - GOWORK=off go mod tidy -diff
      - GOWORK=off go mod verify
      - go vet -mod=readonly ./...
      - go test -mod=readonly -run='^$' ./...

  _run-tests:
    internal: true
    requires:
      vars:
        - WORK_DIR
    dir: "{{.ROOT_DIR}}/{{.WORK_DIR}}"
    cmds:
      - echo "==> {{.WORK_DIR}}"
      - go test -mod=readonly -shuffle=on -v -count=1 ./...

  _run-race-tests:
    internal: true
    requires:
      vars:
        - WORK_DIR
    dir: "{{.ROOT_DIR}}/{{.WORK_DIR}}"
    cmds:
      - echo "==> {{.WORK_DIR}}"
      - go test -mod=readonly -race -shuffle=on -v -count=1 ./...

  _run-linter:
    internal: true
    requires:
      vars:
        - WORK_DIR
    cmds:
      - echo "==> {{.WORK_DIR}}"
      - mkdir -p "{{.GOSUMCACHE}}"
      - >
        docker run --rm
        -u $(id -u):$(id -g)
        -v {{.ROOT_DIR}}:/app
        -v {{.GOMODCACHE}}:/go/pkg/mod
        -v {{.GOSUMCACHE}}:/go/pkg/sumdb
        -v {{.GOCACHE}}:/go/build-cache
        -e GOMODCACHE=/go/pkg/mod
        -e GOCACHE=/go/build-cache
        -e GOLANGCI_LINT_CACHE=/go/build-cache/golangci-lint
        -e GOWORK=/app/go.work
        -w {{.WORK_DIR}}
        golangci/golangci-lint:{{.LINTER_VER}}
        golangci-lint run
        --config=/app/.golangci.yml
        --timeout=5m
        --modules-download-mode=readonly
