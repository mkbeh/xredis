name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            examples/**/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Verify modules
        run: task verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            examples/**/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run golangci-lint
        run: task lint

  test:
    name: Tests (Redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REDIS_ADDR: localhost:6379

    strategy:
      fail-fast: false
      matrix:
        redis:
          - 7-alpine
          - 8-alpine

    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            examples/**/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run race tests
        run: task test-race

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_ADDR: localhost:6379
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            examples/**/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run coverage
        run: task coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.out
          flags: tests
          name: xredis
          fail_ci_if_error: true
          disable_search: true
